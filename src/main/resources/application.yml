# =====================================================================================
# НАСТРОЙКИ ПРИЛОЖЕНИЯ И ПОДКЛЮЧЕНИЯ К TEMPORAL
# =====================================================================================
# Роль компонентов в системе заказов:
# - Наше Spring Boot приложение — это одновременно "Сервер приёма заказов" (REST API на порту 8081)
#   и "Сервер-исполнитель" (Worker), в котором крутится код координации (Workflow) и внешних операций (Activity).
# - Сервер Temporal (в Docker на порту 7233) — это "Центральная диспетчерская" с журналом истории заказов (Event History в БД).
# Здесь мы указываем приложению адрес диспетчерской и пакеты, где лежат классы обработки заказов.

server:
  # Наше приложение слушает HTTP-запросы на порту 8081.
  # Почему не 8080? Потому что порт 8080 уже занят красивой веб-панелью Temporal UI (в Docker),
  # где можно глазами смотреть на все запущенные процессы!
  port: 8081

spring:
  application:
    name: temporal-spring-demo

  temporal:
    # 1. АДРЕС СЕРВЕРА TEMPORAL (Диспетчера)
    connection:
      # По этому адресу (порт 7233) наше приложение подключается к серверу Temporal по протоколу gRPC.
      # Важно: сам сервер Temporal к нам первым НИКОГДА не стучится!
      # Наше приложение само звонит на 127.0.0.1:7233 и спрашивает: "Есть работа для меня?" (Long Polling).
      target: 127.0.0.1:7233

    # 2. КОМНАТА ПРОЕКТА (Namespace)
    # Namespace — это изолированная "песочница" (или папка) на сервере Temporal.
    # Все процессы нашего проекта живут в комнате с именем "default".
    namespace: default

    # 3. АВТОПОИСК РАБОТНИКОВ (Workers Auto-Discovery)
    # Вместо того чтобы вручную регистрировать каждый Workflow и каждую Activity в Java-коде,
    # мы говорим библиотеке temporal-spring-boot-starter:
    # "Просканируй пакет com.example.temporal, найди все классы с пометками @WorkflowImpl и @ActivityImpl
    #  и автоматически запусти для них Работников (Workers), которые будут слушать свои очереди задач!"
    workers-auto-discovery:
      packages:
        - com.example.temporal
